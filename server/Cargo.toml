[package]
name = "sensorithm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.17.1"
webbrowser = "1.2.4"
which = "8.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
windows = { version = "0.61", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"
uuid = { version = "1.26.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
] }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
