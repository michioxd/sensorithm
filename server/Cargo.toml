[package]
name = "sensorithm-server"
version = "0.1.2"
edition = "2024"
authors = ["michioxd"]
description = "Windows server for sensorithm camera-based rhythm game sensors"
license = "GPL-3.0-only"
repository = "https://github.com/michioxd/sensorithm"
homepage = "https://github.com/michioxd/sensorithm"

[package.metadata.winresource]
CompanyName = "michioxd"
FileDescription = "sensorithm server"
InternalName = "sensorithm-server"
LegalCopyright = "Released under the GNU General Public License v3.0"
OriginalFilename = "sensorithm-server.exe"
ProductName = "sensorithm server"

[dependencies]
slint = { version = "1.17.1", features = [
    "raw-window-handle-06",
    "unstable-winit-030",
] }
webbrowser = "1.2.4"
which = "8.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
windows = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"
uuid = { version = "1.26.0", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
winrt-notification = "0.5.1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
] }

[build-dependencies]
slint-build = "1.17.1"
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
